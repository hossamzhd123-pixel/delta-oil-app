<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>STAGING Delta Oil Courier</title>
<style>html,body{margin:0;background:#edf2f8;color:#15304d;font:18px Arial,sans-serif}header{background:#0b2a4a;color:#fff;padding:18px;text-align:center;font-size:24px;font-weight:bold}main{max-width:520px;margin:24px auto;padding:0 16px}section{background:#fff;border-radius:14px;padding:22px;box-shadow:0 2px 8px #0002;text-align:center}label{display:block;margin:14px 0 4px;font-weight:bold;text-align:right}input{width:100%;box-sizing:border-box;font:18px Arial;padding:12px;border:1px solid #9fb2c8;border-radius:8px}button{display:block;width:100%;margin-top:18px;background:#0b6bcb;color:#fff;font:bold 18px Arial;padding:14px;border:0;border-radius:10px}button:disabled{opacity:.6}.err{color:#a12626;font-weight:bold;margin-top:14px;display:none}#gb{display:flex;justify-content:center;margin:16px 0}</style></head>
<body><header>Delta Oil | STAGING</header><main><section id="box"><h1 style="font-size:21px;margin:0 0 6px">تسجيل دخول المندوب</h1><p id="st">جارٍ التحميل</p><div id="gb"></div>
<form id="f" style="display:none" autocomplete="off"><label for="n">الاسم</label><input id="n" maxlength="80" autocomplete="off" required><label for="p">رقم الهاتف</label><input id="p" type="tel" inputmode="tel" maxlength="40" autocomplete="off" required><button id="go" type="submit">دخول</button></form>
<div id="er" class="err" role="alert"></div><button id="sw" style="display:none;background:#fff;color:#0b6bcb;border:1px solid #0b6bcb">تبديل حساب Google</button></section></main>
<script>
var CLIENT='751702780268-etko0ur034s6ie8dm4h72kpl9de9rdam.apps.googleusercontent.com',BACK='https://script.google.com/macros/s/AKfycbzZ4zvyf-3afWjtZSLZM-dGD42xaiEtyOhq1c3-oE4leBa7Oiz3-lFuZQEM6I1RIZ8/exec',TOK='';
function call(fn,args){return fetch(BACK,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({t:TOK,fn:fn,args:args||[]})}).then(function(r){return r.json()}).then(function(j){if(!j||j.ok!==true){var m=(j&&j.error)||'E';if(m==='token'){try{sessionStorage.removeItem('gt')}catch(e){}setTimeout(function(){location.reload()},300)}throw new Error(m)}return j.r})}
function mk(ok,fail){return new Proxy({},{get:function(t,k){if(k==='withSuccessHandler')return function(h){return mk(h,fail)};if(k==='withFailureHandler')return function(h){return mk(ok,h)};return function(){var a=[].slice.call(arguments);call(k,a).then(function(r){if(ok)ok(r)},function(e){if(fail)fail(e)})}}})}
window.google=window.google||{};window.google.script={run:mk(null,null)};
var $=function(x){return document.getElementById(x)};
function bad(t){$('er').textContent=t;$('er').style.display='block'}
function openApp(){return call('appHtml85').then(function(h){if(typeof h==='string'&&h.length>1000){document.open();document.write(h);document.close()}else throw new Error('E')})}
function after(){$('st').textContent='جارٍ التحقق';$('er').style.display='none';openApp().catch(function(e){var m=String(e.message||e);$('gb').style.display='none';if(/Entry required/.test(m)){$('st').textContent='اكتب اسمك ورقم هاتفك';$('f').style.display='block'}else if(/not an authorized courier/.test(m)){$('st').textContent='';$('f').style.display='none';bad('⛔ هذا الحساب غير مسموح له بالدخول. تواصل مع الإدارة.');$('sw').style.display='block'}else{$('st').textContent='';bad('تعذر الاتصال. حاول مرة أخرى.');$('sw').style.display='block'}})}
function onCred(r){TOK=r.credential;try{sessionStorage.setItem('gt',TOK)}catch(e){}after()}
$('f').onsubmit=function(ev){ev.preventDefault();$('go').disabled=true;$('er').style.display='none';call('entry85',[$('n').value,$('p').value]).then(function(r){if(r&&r.ok===true)return openApp();throw new Error('x')}).catch(function(){$('go').disabled=false;$('p').value='';bad('⛔ غير مسموح لك بالدخول. تواصل مع الإدارة.')})};
$('sw').onclick=function(){try{sessionStorage.removeItem('gt')}catch(e){}if(window.google.accounts)google.accounts.id.disableAutoSelect();location.reload()};
function init(){google.accounts.id.initialize({client_id:CLIENT,callback:onCred,auto_select:true,cancel_on_tap_outside:false});google.accounts.id.renderButton($('gb'),{theme:'filled_blue',size:'large',text:'signin_with',locale:'ar'});$('st').textContent='سجّل الدخول بحساب Google';var t='';try{t=sessionStorage.getItem('gt')||''}catch(e){}if(t){try{var pl=JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));if(pl.exp*1000>Date.now()+60000){TOK=t;after();return}}catch(e){}}google.accounts.id.prompt()}
var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=init;s.onerror=function(){$('st').textContent='';bad('تعذر تحميل تسجيل الدخول')};document.head.appendChild(s);
</script></body></html>
